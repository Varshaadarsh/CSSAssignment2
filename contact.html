        <img src="images/DSC_0148.JPG" alt="Profile Picture" class="profile">

    </header>

    <main>
        <section class="contact">
            <h2>Stay on the line</h2>
            <form>
                <div>
                    <label for="name">Name: </label>
                    <input type="text" name="name" id="name" placeholder="Enter your Name" required>
                </div>
                <br>
                <div>
                    <label for="email">Email: </label>
                    <input type="email" name="email" id="email" placeholder="Enter your Email" required>
                </div>
                <br>
                <div>
                    <label for="phonenumber">Phone Number: </label>
                    <input type="tel" id="phonenumber" name="phonenumber" pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}" required
                        placeholder="Enter your Phone Number">
                </div>
                <br>
                <div>
                    <label for="specialization">Specialization: </label>
                    <input type="text" id="specialization" name="specialization"
                        placeholder="You are Specialization in">
                </div>
                <br>
                <div>
                    <label for="message">Message: </label>
                    <textarea name="messsage" id="message" rows="4" placeholder="Leave a Message"></textarea>
                </div>
                <br>
                <button type="submit">Submit</button>
                <button type="reset">Reset</button>
            </form>
        </section>
    </main>
    <footer>
